name: Continuous Integration

on:
  pull_request:

jobs:
  test:
    uses: ./.github/workflows/test.yml

  integration-tests:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/integration_tests.yml

  build-check:
    uses: ./.github/workflows/build.yml
    with:
      push_artifacts: false
